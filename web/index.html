<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Drops Miner</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
    <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M7 8h10c2 0 3 2 4 8 1 5-2 6-5 2H8c-3 4-6 3-5-2 1-6 2-8 4-8zM7 12h5M9.5 9.5v5M16 12h.01M18 14h.01"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 22h8M12 19v3M9 9l6 3-6 3z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10 2h4l.5 2 2 1 2-.7 2 3.4-1.5 1.6v2l1.5 1.6-2 3.4-2-.7-2 1-.5 2h-4l-.5-2-2-1-2 .7-2-3.4L5 11.3v-2L3.5 7.7l2-3.4 2 .7 2-1z"/><circle cx="12" cy="10.3" r="2.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 16a9 9 0 0 1-12-12 9 9 0 1 0 12 12z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 15a6 6 0 0 1 8 0M12 19h.01"/></symbol>
  </svg>
  <nav class="sidebar" aria-label="Pages">
    <div class="brand"><svg><use href="#i-box"/></svg><span>Drops Miner</span></div>
    <a href="#/" data-page="overview"><svg><use href="#i-home"/></svg><span>Overview</span></a>
    <a href="#/inventory" data-page="inventory"><svg><use href="#i-box"/></svg><span>Inventory</span></a>
    <a href="#/games" data-page="games"><svg><use href="#i-gamepad"/></svg><span>Games</span></a>
    <a href="#/channels" data-page="channels"><svg><use href="#i-tv"/></svg><span>Channels</span></a>
    <a href="#/settings" data-page="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></a>
    <a href="#/logs" data-page="logs"><svg><use href="#i-list"/></svg><span>Logs</span></a>
  </nav>
  <main class="shell">
    <header class="topbar">
      <h1 id="page-title" tabindex="-1">Overview</h1>
      <label class="search"><svg><use href="#i-search"/></svg><span class="sr-only">Search this page</span><input id="search" type="search" placeholder="Search this page"></label>
      <div class="top-status"><span id="miner-state" class="chip">—</span><span id="ws-status" class="chip" role="status">Offline</span><span id="readonly-badge" class="chip" hidden>Read-only</span><button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme"><svg><use href="#i-moon"/></svg></button></div>
    </header>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
    <section id="auth-panel" class="card" hidden><h2>Dashboard token</h2><form id="auth-form" class="inline"><label for="auth-token">Token</label><input id="auth-token" type="password" autocomplete="off" required><button type="submit">Connect</button></form></section>
    <div id="dashboard" hidden><div id="page-content" class="cards"></div></div>
  </main>
</body>
</html>
